        <section class="buscador">
        <form role="searchbox" id="form-submit">
            <div>
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-search">

        </form>

        <div class="selects">
            <label>
                <select name="Tecnology" id="tecnologys">
                    <!-- El primero como es el nombre de las opciones no le ponemos nada en value  -->
                    <option value="">Tencología</option>
                    <option value="react">React</option>
                    <option value="nodejs">Node.js</option>
                </select>
            </label>

            <label>
                <select name="location" id="location">
                    <option value="">Ubicación</option>
                    <option value="ciudad de méxico">Ciudad de México</option>
                    <option value="guadalajara">Guadalajara</option>
                    <option value="remoto">Remoto</option>
                    <option value="monterrey">Monterrey</option>
                </select>
            </label>

            <label>
                <select name="contract-type" id="contract-type">
                    <option value="">Tipo de contrato</option>
                    <option value="practicas">Practicas</option>
                    <option value="largo">Largo</option>
                </select>
            </label>

            <label>
                <select name="experience-level" id="experience-level">
                    <option value="">Nivel de experiencia</option>
                    <option value="junior">Junior</option>
                    <option value="senior">Senior.js</option>
                </select>
            </label>

        </div>
